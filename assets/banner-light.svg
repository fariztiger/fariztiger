<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Fariz Tiger / Faiz Suhaimi — Malaysia-based independent developer: trading automation, Web3 research, Python tooling and QA">
  <title>Faiz Suhaimi — Trading automation · Web3 research · Python tooling · QA</title>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.55" stop-color="#EEF5FA"/>
      <stop offset="1" stop-color="#FBF7EE"/>
    </linearGradient>
    <linearGradient id="laccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E9A87"/>
      <stop offset="0.55" stop-color="#2E86C1"/>
      <stop offset="1" stop-color="#C08A1E"/>
    </linearGradient>
    <linearGradient id="lgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A93A"/>
      <stop offset="0.5" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#8A6108"/>
    </linearGradient>
    <radialGradient id="lglowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E9A87" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0E9A87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lglowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0A93A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E0A93A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0b1220" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="lround"><rect width="1200" height="340" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#lround)">
    <rect width="1200" height="340" fill="url(#lbg)"/>
    <rect width="1200" height="340" fill="url(#lgrid)"/>
    <circle cx="1080" cy="60" r="300" fill="url(#lglowTeal)"/>
    <circle cx="150" cy="330" r="280" fill="url(#lglowGold)"/>

    <!-- glass panel -->
    <rect x="30" y="30" width="1140" height="280" rx="22" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="30.75" y="30.75" width="1138.5" height="278.5" rx="22" fill="none" stroke="#0b1220" stroke-opacity="0.10" stroke-width="1.5"/>
    <rect x="30" y="30" width="1140" height="2.5" rx="1.25" fill="url(#laccent)" opacity="0.9"/>

    <!-- left content -->
    <text x="76" y="108" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3.4" fill="#0B7F70">GITHUB.COM/FARIZTIGER · MALAYSIA</text>
    <text x="74" y="178" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#0B1220">Faiz Suhaimi</text>
    <text x="76" y="214" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#44566C">Trading automation · Web3 research · Python tooling · QA</text>

    <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
      <rect x="76" y="238" width="178" height="34" rx="17" fill="#0E9A87" fill-opacity="0.08" stroke="#0E9A87" stroke-opacity="0.28"/>
      <text x="165" y="260" text-anchor="middle" fill="#0A6E60">XAUUSD · MQL4/MQL5</text>

      <rect x="264" y="238" width="140" height="34" rx="17" fill="#2E86C1" fill-opacity="0.08" stroke="#2E86C1" stroke-opacity="0.26"/>
      <text x="334" y="260" text-anchor="middle" fill="#1C5E8C">Python &amp; data</text>

      <rect x="414" y="238" width="132" height="34" rx="17" fill="#C08A1E" fill-opacity="0.10" stroke="#C08A1E" stroke-opacity="0.30"/>
      <text x="480" y="260" text-anchor="middle" fill="#7A560C">XRPL / Web3</text>

      <rect x="556" y="238" width="122" height="34" rx="17" fill="#0b1220" fill-opacity="0.04" stroke="#0b1220" stroke-opacity="0.16"/>
      <text x="617" y="260" text-anchor="middle" fill="#33445A">Manual QA</text>
    </g>

    <!-- tiger monogram -->
    <g>
      
      <circle cx="1006" cy="168" r="86" fill="#ffffff" fill-opacity="0.85" stroke="url(#laccent)" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="1006" cy="168" r="74" fill="none" stroke="#0b1220" stroke-opacity="0.08" stroke-width="1"/>
      <text x="1006" y="189" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#lgold)">FT</text>
      <text x="1006" y="214" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="2.6" fill="#6B7C93">SINCE 2016</text>
    </g>

    <rect x="30" y="307" width="1140" height="1" fill="url(#laccent)" opacity="0.20"/>
  </g>
</svg>
