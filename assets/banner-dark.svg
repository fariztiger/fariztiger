<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Fariz Tiger / Faiz Suhaimi — Malaysia-based independent developer: trading automation, Web3 research, Python tooling and QA">
  <title>Faiz Suhaimi — Trading automation · Web3 research · Python tooling · QA</title>
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#050e14"/>
    </linearGradient>
    <linearGradient id="daccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4EE1C0"/>
      <stop offset="0.55" stop-color="#78C8FF"/>
      <stop offset="1" stop-color="#F5C451"/>
    </linearGradient>
    <linearGradient id="dgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="0.5" stop-color="#F5C451"/>
      <stop offset="1" stop-color="#C8922A"/>
    </linearGradient>
    <radialGradient id="dglowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4EE1C0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4EE1C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dglowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5C451" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F5C451" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="dround"><rect width="1200" height="340" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#dround)">
    <rect width="1200" height="340" fill="url(#dbg)"/>
    <rect width="1200" height="340" fill="url(#dgrid)"/>
    <circle cx="1080" cy="60" r="300" fill="url(#dglowTeal)"/>
    <circle cx="150" cy="330" r="280" fill="url(#dglowGold)"/>

    <!-- glass panel -->
    <rect x="30" y="30" width="1140" height="280" rx="22" fill="#ffffff" fill-opacity="0.028"/>
    <rect x="30.75" y="30.75" width="1138.5" height="278.5" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
    <rect x="30" y="30" width="1140" height="2.5" rx="1.25" fill="url(#daccent)" opacity="0.85"/>

    <!-- left content -->
    <text x="76" y="108" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3.4" fill="#6FE3C8">GITHUB.COM/FARIZTIGER · MALAYSIA</text>
    <text x="74" y="178" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#F2F7FF">Faiz Suhaimi</text>
    <text x="76" y="214" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#A6BCD4">Trading automation · Web3 research · Python tooling · QA</text>

    <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
      <rect x="76" y="238" width="178" height="34" rx="17" fill="#4EE1C0" fill-opacity="0.10" stroke="#4EE1C0" stroke-opacity="0.30"/>
      <text x="165" y="260" text-anchor="middle" fill="#A8EFDC">XAUUSD · MQL4/MQL5</text>

      <rect x="264" y="238" width="140" height="34" rx="17" fill="#78C8FF" fill-opacity="0.09" stroke="#78C8FF" stroke-opacity="0.28"/>
      <text x="334" y="260" text-anchor="middle" fill="#B9DFFF">Python &amp; data</text>

      <rect x="414" y="238" width="132" height="34" rx="17" fill="#F5C451" fill-opacity="0.10" stroke="#F5C451" stroke-opacity="0.30"/>
      <text x="480" y="260" text-anchor="middle" fill="#F7DCA0">XRPL / Web3</text>

      <rect x="556" y="238" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="617" y="260" text-anchor="middle" fill="#C6D4E6">Manual QA</text>
    </g>

    <!-- tiger monogram -->
    <g>
      
      <circle cx="1006" cy="168" r="86" fill="#ffffff" fill-opacity="0.035" stroke="url(#daccent)" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="1006" cy="168" r="74" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
      <text x="1006" y="189" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#dgold)">FT</text>
      <text x="1006" y="214" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="2.6" fill="#8FA6C0">SINCE 2016</text>
    </g>

    <!-- bottom hairline -->
    <rect x="30" y="307" width="1140" height="1" fill="url(#daccent)" opacity="0.18"/>
  </g>
</svg>
